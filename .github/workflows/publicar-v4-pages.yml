name: Publicar V4 en GitHub Pages sin alterar JAT Vet anterior
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-v4-pages.yml'
permissions:
  contents: write
jobs:
  publicar:
    # Bloqueado: reconstruye otra rama; usar artefacto 4.0.2 revisado tras autorización.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener rama de desarrollo
        uses: actions/checkout@v4
        with:
          ref: desarrollo-v4-firebase
          path: fuente
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar
        working-directory: fuente
        run: |
          npm_config_cache="$RUNNER_TEMP/npm-cache" npm ci
          npm run build
          npm test
          test -f dist/v4/index.html
          grep -q '/jatvet/assets/' dist/v4/index.html
          test -f dist/v4/firebase-config.json
      - name: Obtener sitio actual
        uses: actions/checkout@v4
        with:
          ref: main
          path: sitio
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copiar únicamente la nueva V4
        run: |
          mkdir -p sitio/v4 sitio/assets
          cp -R fuente/dist/v4/. sitio/v4/
          cp -R fuente/dist/assets/. sitio/assets/
          if [ -f fuente/dist/acceso-prueba.html ]; then cp fuente/dist/acceso-prueba.html sitio/acceso-prueba.html; fi
      - name: Publicar sin modificar la aplicación anterior
        working-directory: sitio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v4 assets acceso-prueba.html
          if ! git diff --cached --quiet; then git commit -m 'Publicar JAT Vet V4 en ruta independiente de GitHub Pages'; git push origin main; fi
