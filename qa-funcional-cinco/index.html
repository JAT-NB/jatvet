<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JAT Vet · QA Funcional</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#edf4f5;color:#163b50}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:#143b54;color:white;flex-wrap:wrap}header strong{font-size:17px}header small{display:block;color:#d0e6eb}button{border:0;border-radius:8px;background:#fff0f0;color:#9f1e2c;padding:9px 13px;font-weight:700;cursor:pointer}#save{font-size:12px;color:#c9e4db}iframe{display:block;width:100%;height:calc(100dvh - 122px);min-height:520px;border:0}@media(max-width:640px){iframe{height:calc(100dvh - 165px)}header{padding:8px 12px}}</style></head><body><header><div><strong>🐾 JAT Vet · QA FUNCIONAL</strong><small>Aplicación funcional aislada · datos locales · sin Firebase</small></div><span id="save">Los datos se guardan solo en este navegador</span><button id="reset" type="button">Reiniciar QA Funcional</button></header><section id="qaToolbar" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#e4f1f9;color:#153d5a;font:13px system-ui"><strong>QA de pantallas reales</strong><span>Usá Pacientes, Turnos, Servicios y Caja con datos de prueba.</span><button type="button" id="qaResume">Probar regreso</button><button type="button" id="qaUpdate">Probar aviso de actualización</button><span id="qaFeedback" role="status"></span></section><iframe id="app" title="JAT Vet QA Funcional"></iframe><script src="/jatvet/assets/qa-limpio-v1.js?v=4"></script><div id="qaBanner" hidden style="position:fixed;bottom:15px;left:12px;right:12px;max-width:430px;margin:auto;padding:18px;background:#123b50;color:white;border-radius:14px;box-shadow:0 12px 35px #102b4960;font:14px system-ui;z-index:999"><strong>Actualización disponible (prueba visual)</strong><p>Guardá los cambios antes de actualizar.</p><button type="button" id="qaNow">Actualizar ahora</button><button type="button" id="qaLater">Más tarde</button></div><script>
(()=>{const f=document.getElementById('app'),feedback=document.getElementById('qaFeedback'),banner=document.getElementById('qaBanner');document.getElementById('qaResume').onclick=()=>{f.style.opacity='.75';setTimeout(()=>{f.style.opacity='1';feedback.textContent='Regreso correcto: la app conserva el estado.'},250)};document.getElementById('qaUpdate').onclick=()=>banner.hidden=false;document.getElementById('qaLater').onclick=()=>banner.hidden=true;document.getElementById('qaNow').onclick=()=>{banner.hidden=true;feedback.textContent='Aviso probado. No se recargó la app para preservar los datos.'};document.addEventListener('visibilitychange',()=>{if(!document.hidden)feedback.textContent='Regresaste a QA; los datos locales se conservan.'});})();
</script></body></html>
