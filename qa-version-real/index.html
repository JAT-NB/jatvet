<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JAT Vet — laboratorio de actualización</title><style>body{font:16px system-ui;max-width:650px;margin:50px auto;padding:20px;color:#123b50}button{padding:12px;border-radius:8px}#log{white-space:pre-wrap;background:#eef4f6;padding:16px;border-radius:8px}</style></head><body><h1>🐾 JAT Vet — prueba aislada</h1><p>Este laboratorio no inicia sesión, no accede a Firebase y no modifica la aplicación de Vero.</p><p><strong>Versión instalada:</strong> <span id="installed">4.0.0</span></p><p><strong>Versión publicada:</strong> <span id="published">consultando…</span></p><p id="log">Comprobando…</p><button id="later" hidden>Más tarde</button> <button id="update" hidden>Actualizar ahora</button><script>const installed=localStorage.getItem('jatvet_qa_version')||'4.0.0';document.getElementById('installed').textContent=installed;fetch('./version.json?check='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(v=>{document.getElementById('published').textContent=v.version;const has=v.version!==installed;document.getElementById('log').textContent=has?'Hay una nueva versión disponible.':'La versión instalada está actualizada.';document.getElementById('later').hidden=!has;document.getElementById('update').hidden=!has;document.getElementById('later').onclick=()=>{document.getElementById('log').textContent='Aviso pospuesto. No se modificó la versión instalada.';document.getElementById('later').hidden=true;document.getElementById('update').hidden=true;};document.getElementById('update').onclick=()=>{localStorage.setItem('jatvet_qa_version',v.version);location.reload();};}).catch(()=>document.getElementById('log').textContent='No se pudo consultar la versión.');</script></body></html>
