<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e8f8f7"><title>JAT Vet · Nuevo acceso</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#ecf9f8;color:#102e47}.shell{min-height:100dvh;max-width:470px;margin:auto;background:radial-gradient(ellipse at 90% 0,#bdeceb,transparent 42%),linear-gradient(#f9ffff,#e1f5f4);padding:24px 22px 0}.brand{display:flex;align-items:center;gap:14px;justify-content:center;margin:8px 0 30px}.brand img{width:104px;height:104px}.brand-name{font-size:43px;letter-spacing:-2px;font-weight:850;white-space:nowrap;line-height:1.15}.brand-name b{color:#07959c}.brand-sub{font-size:12px;color:#647a89;line-height:1.4}.intro{text-align:center;margin-bottom:26px}.intro h1{font-size:26px;line-height:1.22;letter-spacing:-.8px;margin:0 0 10px}.intro p{margin:0;color:#6c8290;font-size:14px}.field{margin-bottom:17px}.field label{font-size:13px;font-weight:700;display:block;margin-bottom:8px}.input-wrap{height:61px;border-radius:17px;background:white;display:flex;align-items:center;gap:13px;padding:0 15px;box-shadow:0 6px 22px #135b6810;border:1px solid #e8f0f1}.input-wrap svg{width:22px;height:22px;flex-shrink:0;stroke:#17445b;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.input-wrap input{border:0;outline:0;min-width:0;flex:1;font:15px system-ui;color:#143b50;background:transparent}.input-wrap input::placeholder{color:#8196a1}.text-button{background:none;border:0;color:#048b95;text-decoration:underline;font-size:13px;cursor:pointer;padding:6px 0}.primary{width:100%;height:59px;border:0;border-radius:16px;background:linear-gradient(90deg,#079da7,#078a95);box-shadow:0 8px 20px #0c9aa32a;color:white;font-weight:800;font-size:19px;cursor:pointer;margin-top:8px}.recover{display:block;text-align:center;margin:21px auto 23px}.pets{position:relative;height:230px;overflow:hidden;background:linear-gradient(135deg,#d4f4f0,#8ad0d1);border-radius:24px 24px 0 0}.pets img{width:100%;height:100%;object-fit:cover}.foot{background:#e4f4f3;text-align:center;color:#5c7785;padding:14px;font-size:12px;border-radius:0 0 20px 20px}.user{margin-bottom:18px}.user[hidden],.field[hidden]{display:none}.message{min-height:17px;font-size:12px;text-align:center;color:#a54b4b;margin:8px 0}.eye{border:0;background:transparent;cursor:pointer;color:#4b697b;font-size:22px}.demo{position:fixed;right:9px;top:8px;font-size:10px;color:#77919a}@media(max-height:750px){.shell{padding-top:10px}.brand{margin-bottom:14px}.intro{margin-bottom:16px}.pets{height:150px}}
</style></head><body><main class="shell"><span class="demo">Vista previa · Sin acceso a datos</span><div class="brand"><img src="./login-logo.svg" alt="Logo JAT Vet"><div><div class="brand-name">JAT <b>Vet</b></div><div class="brand-sub">Gestión de servicios<br>veterinarios a domicilio</div></div></div><div class="intro"><h1 id="title">¡Bienvenido a JAT Vet!</h1><p id="subtitle">Ingresá con tu cuenta para continuar</p></div><div class="user" id="user" hidden><div class="input-wrap"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="m3 7 9 7 9-7"/></svg><span id="saved" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px"></span><button class="text-button" id="change">Cambiar</button></div></div><form id="form"><div class="field" id="emailField"><label for="email">Correo electrónico</label><div class="input-wrap"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="m3 7 9 7 9-7"/></svg><input type="email" id="email" placeholder="tu@email.com" autocomplete="username" required></div></div><div class="field"><label for="password">Contraseña</label><div class="input-wrap"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" type="password" placeholder="Ingresá tu contraseña" autocomplete="current-password" required><button class="eye" type="button" id="eye" aria-label="Mostrar contraseña">◉</button></div></div><button class="primary" type="submit">Ingresar →</button><div class="message" id="message"></div><button type="button" class="text-button recover" id="recover">¿Olvidaste tu contraseña?</button></form><div class="pets"><img src="./login-pets.svg" alt="Perro y gato"></div><footer class="foot">JAT Soluciones Informáticas</footer></main><script>
const email=document.querySelector('#email'),pass=document.querySelector('#password'),user=document.querySelector('#user'),emailField=document.querySelector('#emailField'),title=document.querySelector('#title'),subtitle=document.querySelector('#subtitle'),saved=document.querySelector('#saved'),message=document.querySelector('#message');let last='';try{last=localStorage.getItem('jatvet:last-login-email:v4')||''}catch{}function render(){const known=!!last;user.hidden=!known;emailField.hidden=known;email.value=last;email.readOnly=known;saved.textContent=last;title.textContent=known?'¡Bienvenido nuevamente!':'¡Bienvenido a JAT Vet!';subtitle.textContent=known?'Ingresá tu contraseña para continuar':'Ingresá con tu cuenta para continuar'}render();document.querySelector('#change').onclick=()=>{last='';render();email.focus()};document.querySelector('#eye').onclick=()=>{pass.type=pass.type==='password'?'text':'password'};document.querySelector('#form').onsubmit=e=>{e.preventDefault();message.textContent='Esta es una vista previa visual. El acceso real permanece en JAT Vet 4.0.'};document.querySelector('#recover').onclick=()=>{message.textContent='La recuperación de contraseña funciona desde la aplicación principal.'};
</script></body></html>
